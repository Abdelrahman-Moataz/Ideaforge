name: Flutter Build Check

on:
  push:
    branches: [flutter-migration]
  pull_request:
    branches: [flutter-migration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform project
        run: flutter create --platforms=android --project-name ideaforge .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ideaforge-flutter-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
